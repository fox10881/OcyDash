[package]
name = "ocydash"
version = "1.1.0"
edition = "2024"
description = "Tray-native driver & layout editor for the Ocypus Sigma PRO L24 LCD"
license = "MIT"

[build-dependencies]
embed-resource = "3"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cosmic-text = "0.19.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
fontdb = "0.23"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
jpeg-encoder = "0.7.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }
winreg = "0.56.0"
